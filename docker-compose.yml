services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: sh -c "node scripts/setup-dev-env.mjs && npm run dev --workspace=@stockey/api"
    working_dir: /app
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://stockey:stockey@postgres:5432/stockey
      REDIS_URL: redis://redis:6379
      API_ORIGIN: http://localhost:4000
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: npm run dev --workspace=@stockey/frontend -- --host 0.0.0.0
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_ORIGIN: http://localhost:4000
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockey
      POSTGRES_USER: stockey
      POSTGRES_PASSWORD: stockey
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockey -d stockey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  frontend_node_modules:
